[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stepdoc"
version = "0.2.0"
description = "Turn test code into test documentation: procedures with symbolic values and executed reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["executing>=2.0"]
authors = [{ name = "Guillermo Gil" }]
keywords = ["pytest", "testing", "documentation", "test procedure", "test report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/guillegil/stepdoc"
Source = "https://github.com/guillegil/stepdoc"
Changelog = "https://github.com/guillegil/stepdoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pytest = ["pytest>=8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "mypy>=1.10",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
stepdoc = "stepdoc.cli:main"

[project.entry-points.pytest11]
stepdoc = "stepdoc.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/stepdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
stepdoc_skip_modules = ["httpx", "tests.fakes"]
enable_assertion_pass_hook = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
